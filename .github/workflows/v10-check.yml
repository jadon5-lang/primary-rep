name: THE SEAM V10 Verification
on:
  push:
    branches: [v10-staging, v10-2-release]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Validate inline survey JavaScript
        run: |
          node --input-type=module -e "import fs from 'node:fs';import vm from 'node:vm';const s=fs.readFileSync('public/index.html','utf8');const script=s.match(/<script>([\\s\\S]*?)<\\/script>/)?.[1];if(!script)throw Error('No script found');new vm.Script(script);"

  netlify-test-site:
    if: github.ref == 'refs/heads/v10-2-release'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Netlify test site published the release without creating research records
        shell: bash
        run: |
          set -euo pipefail
          URL="https://the-seam-v9-test.netlify.app"
          ok=0
          for attempt in $(seq 1 14); do
            html=$(curl --silent --show-error --location --max-time 12 "$URL/" || true)
            health=$(curl --silent --show-error --location --max-time 12 "$URL/api/health" || true)
            report=$(curl --silent --show-error --location --max-time 12 "$URL/?report=1" || true)
            if [[ "$html" == *"slider-float"* ]] && [[ "$html" == *"question-text"* ]] && [[ "$report" == *'id="researchScreen"'* ]] && [[ "$health" == *'"study":"THE SEAM V10.2"'* ]] && [[ "$health" == *'"shared_storage":true'* ]]; then
              echo "V10.2 survey, preserved researcher page and shared Netlify storage are live on the TEST site."
              ok=1
              break
            fi
            echo "Attempt $attempt: Waiting for test site to publish V10.2 (or for server-side storage to become healthy)..."
            sleep 15
          done
          if [[ "$ok" != 1 ]]; then
            echo "FAIL: Could not verify the full V10.2 test site. Inspect the Netlify test project's deploy log, build settings and environment variables."
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 15 "$URL/api/research")
          [[ "$status" == "401" ]] || { echo "FAIL: Private researcher endpoint must refuse unauthenticated access (received $status)."; exit 1; }
          echo "PASS: Researcher endpoint requires authentication. No test participant records were submitted."
      - name: Verify Netlify stores, recovers and withdraws a temporary TEST response
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {randomBytes} from 'node:crypto';
          const base='https://the-seam-v9-test.netlify.app/api/';
          const token=randomBytes(32).toString('base64url');
          const answers=[61.7,42.6,73.2,11.1,26.6,31.5,null,null,84.9];
          const json=async(response)=>{let d;try{d=await response.json()}catch{throw new Error('Expected JSON from '+response.url+' (HTTP '+response.status+')')}return d};
          let id=null;
          try{
            const payload={consent:true,answers,device_token:token};
            const response=await fetch(base+'submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
            const submitted=await json(response);
            if(response.status!==201||!submitted.ok)throw new Error('New TEST submission failed (HTTP '+response.status+'): '+(submitted.error||'unknown error'));
            id=submitted.record.id;
            assert.equal(submitted.record.survey_version,'V10.2');
            assert.deepEqual(submitted.record.answers,answers);
            assert.ok(/^\\d{3}$/.test(id));
            assert.ok(submitted.record.coords,'A complete Q1–Q3 score must plot');
            const mappedResponse=await fetch(base+'map',{headers:{'x-seam-token':token}});
            const mapped=await json(mappedResponse);
            assert.equal(mappedResponse.status,200);
            assert.equal(mapped.ok,true);
            assert.ok(mapped.count>=1);
            assert.ok(mapped.plotted_count>=1);
            const replay=await fetch(base+'submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
            const saved=await json(replay);
            assert.equal(replay.status,200,'Repeated submission must be recovered without duplicate');
            assert.equal(saved.record.id,id);
            assert.equal(saved.recovered,true);
            console.log('PASS: Live V10.2 submission, decimal values, skipped responses, 3D coordinates, verified map and duplicate protection.');
          } finally {
            if(id){
              const cleanup=await fetch(base+'withdraw',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,device_token:token})});
              const confirmation=await json(cleanup);
              if(cleanup.status!==200||confirmation.withdrawn!==true)throw new Error('URGENT: TEST submission '+id+' could not be deleted from Netlify test dataset.');
              const denied=await fetch(base+'map',{headers:{'x-seam-token':token}});
              assert.equal(denied.status,403,'Withdrawn participant token must lose access');
              console.log('PASS: Temporary TEST response was withdrawn and deleted; no test record retained.');
            }
          }
          NODE
