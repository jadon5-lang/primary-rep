name: THE SEAM V10 Verification
on:
  push:
    branches: [v10-staging]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Validate inline survey JavaScript
        run: |
          node --input-type=module -e "import fs from 'node:fs';import vm from 'node:vm';const s=fs.readFileSync('public/index.html','utf8');const script=s.match(/<script>([\\s\\S]*?)<\\/script>/)?.[1];if(!script)throw Error('No script found');new vm.Script(script);"
